services:
  - type: web
    name: dark-auth-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npx prisma generate
    startCommand: npx prisma db push --accept-data-loss && node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: HMAC_SECRET
        generateValue: true
